# BoulderVision configuration
# Central place for model paths, thresholds, and color definitions so that
# tuning the system never requires editing Python code.

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
models:
  # Detection model used by hold_detector.py.
  # Phase 0/1 MVP uses the generic pretrained yolov8n (auto-downloaded).
  # Once you fine-tune on holds, point this at models/holds_yolov8n.pt.
  hold_detector: "best.pt"

  # Pose backend: RTMPose (top-down). It won both the visual and the quantitative
  # A/B (contact-joint PCK 85% vs yolov8 69%) — see scripts/ab_pose_backends.py.
  # yolov8 / mediapipe backends were dropped; their code paths still exist behind
  # the switch, but we no longer carry their config here.
  pose_backend: "rtmpose"
  rtmpose_mode: "balanced"                # lightweight | balanced | performance
  rtmpose_wholebody: true                 # 133-kpt model: real foot (toe/heel) + hand (finger)
                                          # contact points instead of extrapolating from ankle/wrist

# ---------------------------------------------------------------------------
# Inference thresholds
# ---------------------------------------------------------------------------
detection:
  confidence: 0.25          # minimum box confidence to keep a detection
  iou: 0.45                 # NMS IoU threshold (overlap suppression)
  max_detections: 300       # safety cap on boxes per image

pose:
  confidence: 0.50          # minimum keypoint confidence to trust a joint
  # Contact distances are SCALE-INVARIANT: expressed as a fraction of the climber's
  # torso length (mid-shoulder→mid-hip), measured once per clip. effective_px =
  # frac * torso_px, so the same frac catches identically at any resolution / climber
  # size in frame. The *_px values below are only a fallback when no pose scale exists.
  touch_distance_frac: 0.10    # toe/finger within this fraction of torso of a hold = candidate contact
  release_distance_frac: 0.18  # once gripping, stay until the limb leaves the hold by this fraction (sticky)
  contact_max_speed_frac: 0.16 # faster than this fraction of torso per frame = reaching, not gripping (engage only)
  reach_frac: 0.33          # HANDS: extrapolate past the wrist toward the fingers (only when no wholebody finger point)
  reach_frac_foot: 0.10     # FEET: small extrapolation past the ankle (only when no wholebody toe point)
  engage_min_frames: 3      # must stay near+slow on the SAME hold this many frames before it counts as gripped (1 = instant)
  touch_distance_px: 12     # fallback (px) when no body scale is available
  contact_max_speed_px: 12  # fallback (px/frame) when no body scale is available
  release_distance_px: 20   # fallback (px) when no body scale is available
  primary_min_seconds: 1.0  # a hold held >= this long counts as a real "route hold" in the summary
  smooth_window: 5          # temporal keypoint smoothing window (odd; 1 = off) — steadies jitter
  contact_gap_frames: 8     # bridge contact dropouts up to this many frames (a brief blip, not a release)
  contact_min_run: 2        # drop contacts shorter than this many frames (flicker / near-pass)
  hold_mode_seconds: 0.5    # majority-vote each limb's hold over this window — kills adjacent-hold oscillation
  move_min_displacement_px: 45  # a move only counts if the limb travelled this far (else it's a re-assignment)
  collapse_px: 40           # if L/R hand (or foot) keypoints are within this, one is mislocated -> mark occluded
  jump_px: 120              # a joint that leapt more than this in one frame is mislocated -> mark occluded

# ---------------------------------------------------------------------------
# Detection post-processing — sort raw detections into holds vs. wall furniture
# that should NOT become routes (volumes, start/zone markers, difficulty tape).
# This is a heuristic stopgap; the clean fix is a model retrained with these as
# their own classes (see PROJECT_PLAN.md). Tune per gym.
# ---------------------------------------------------------------------------
filter:
  volume_class: 1           # class id the detector uses for volumes (best.pt: 0=hold, 1=volume)
  volume_area_frac: 0.04    # boxes larger than this fraction of the image are treated as volumes
  tape_aspect: 3.5          # length/width >= this => candidate difficulty tape strip
  tape_max_thickness_px: 60 # ...and the short side must be this thin (else it's a big cut-off shape)
  marker_max_area_frac: 0.0010   # markers are small: box area below this fraction of the image
  marker_max_aspect: 1.4    # ...and roughly square (a circle's box)
  marker_dark_l_max: 90     # ...and very dark (OpenCV Lab L, 0-255)
  marker_chroma_max: 18     # ...and near-neutral (low chroma) — i.e. a black dot
  marker_min_circularity: 0.80   # ...and the dark blob is actually round (square=0.79, circle=0.83+)

# ---------------------------------------------------------------------------
# Route extraction (Phase 2) — holds are grouped into routes by clustering their
# real colors per image, then split spatially. See src/route_extractor.py.
# ---------------------------------------------------------------------------
routes:
  color_eps: 28             # max Lab distance for two holds to share a color (smaller = stricter)
  spatial_eps_px: 250       # max pixel distance for holds to be the same route (non-adaptive mode)
  spatial_min_holds: 1      # raise to drop isolated holds as noise (route needs >= this many nearby)
  adaptive_spatial: true    # measure spacing in hold-widths, not pixels — robust to angled photos
  spatial_scale_eps: 8.0    # max gap between holds in units of hold size (adaptive mode)

# ---------------------------------------------------------------------------
# Color naming — turning a hold's Lab color into a name (red/blue/black/...).
# ---------------------------------------------------------------------------
color_naming:
  chroma_min: 12            # below this Lab chroma a hold is "neutral" (black/white/gray);
                            # tuned via scripts/eval_colors.py — recall 0.90 @ this value on the
                            # eval set; lower recovers more muted holds but adds noise (prec drops)

# ---------------------------------------------------------------------------
# Perspective rectification — for photos taken at a steep angle to the wall.
# Provide the wall's four corners (image pixels) and clustering runs in a
# frontal, un-foreshortened plane. Override per photo with --corners on the CLI.
# Leave enabled: false for near-frontal shots (the adaptive split handles those).
# ---------------------------------------------------------------------------
perspective:
  enabled: false
  corners: []               # 4 [x, y] wall corners, any order, e.g. [[100,200],[1400,150],[1500,1900],[80,1800]]
  save_preview: true        # when on, also write a warped preview to data/output/ to check corners

# ---------------------------------------------------------------------------
# Color classification (HSV)
# ---------------------------------------------------------------------------
# OpenCV HSV ranges: H in [0,179], S in [0,255], V in [0,255].
# Each color may have multiple [lower, upper] ranges (red wraps around H=0/179).
# A crop is assigned the color whose ranges cover the most of its pixels.
colors:
  red:
    - { lower: [0, 80, 50],    upper: [8, 255, 255] }
    - { lower: [172, 80, 50],  upper: [179, 255, 255] }   # red wraps the hue circle
  orange:
    - { lower: [9, 90, 90],    upper: [22, 255, 255] }    # sits between red and yellow
  yellow:
    - { lower: [23, 70, 70],   upper: [34, 255, 255] }
  green:
    - { lower: [35, 50, 50],   upper: [82, 255, 255] }
  cyan:
    - { lower: [83, 40, 50],   upper: [99, 255, 255] }    # turquoise: between green and blue
  blue:
    - { lower: [100, 60, 50],  upper: [125, 255, 255] }
  purple:
    - { lower: [126, 40, 40],  upper: [155, 255, 255] }
  pink:
    - { lower: [156, 35, 90],  upper: [171, 255, 255] }   # hot pink/rose: magenta-red, lighter
  white:
    - { lower: [0, 0, 200],    upper: [179, 40, 255] }     # high value, very low saturation
  black:
    - { lower: [0, 0, 0],      upper: [179, 255, 55] }     # low value = dark/black
# NOTE: ranges are provisional — tuned by eye for typical gym colors. Once the
# fine-tuned detector gives real hold crops, calibrate with scripts/inspect_hsv.py.
# Pink/salmon holds currently fall under red; split them out later if needed.

# BGR colors used when drawing each label's bounding box (OpenCV is BGR, not RGB).
draw_colors:
  red:    [0, 0, 255]
  orange: [0, 140, 255]
  yellow: [0, 255, 255]
  green:  [0, 255, 0]
  cyan:   [255, 255, 0]      # turquoise/cyan — was missing, holds fell through to blue/black
  blue:   [255, 0, 0]
  purple: [255, 0, 200]
  pink:   [147, 20, 255]     # hot pink/rose — was missing, holds fell through to red/purple/black
  white:  [255, 255, 255]
  black:  [40, 40, 40]
  unknown: [200, 200, 200]

# ---------------------------------------------------------------------------
# Paths (relative to project root)
# ---------------------------------------------------------------------------
# data/ is split into two folders:
#   input/  — images/videos you feed in (sample wall.jpg lives here)
#   output/ — generated, annotated results (gitignored)
paths:
  input_dir: "data/input"
  output_dir: "data/output"
  output_image: "data/output/output.jpg"     # hold detection + color labels
  routes_image: "data/output/routes.jpg"      # holds grouped into routes
  holds_image: "data/output/holds.jpg"        # per-hold detected color, NOT grouped
